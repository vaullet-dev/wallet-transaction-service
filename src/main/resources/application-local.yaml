# ---------------------------------------------------------------------------
# Developer machine. Activated automatically by `./mvnw spring-boot:run`
# (see the spring-boot-maven-plugin block in pom.xml). Everything here trades
# safety for feedback speed, and no deployed environment has this profile.
# ---------------------------------------------------------------------------
spring:
  # spring-boot-docker-compose starts compose.yaml and points the datasource at it.
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

logging:
  level:
    dev.vaullet.transaction: DEBUG
    # Seeing the statements is the point locally. Never in production: the parameters are
    # account ids and amounts.
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

app:
  environment: local

transaction:
  currency: EUR
  # Where the other two run on a laptop: wallet-auth-service's Compose Keycloak and a
  # ledger started with --server.port=8081. Neither is needed to start, and a CREDIT is
  # recorded without them. A DEBIT answers 503 while either is down, and 500 while
  # Keycloak is up without this client: its realm has wallet-transaction-service, with
  # this secret and ledger:write as an optional scope, only if you add them.
  keycloak:
    url: http://localhost:${KEYCLOAK_HOST_PORT:58080}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:test-only-secret}
  ledger:
    url: http://localhost:${LEDGER_PORT:8081}

vaullet:
  api:
    allowed-origins: http://localhost:3000,http://localhost:5173
