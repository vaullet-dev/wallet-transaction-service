# The credential the RUNNING SERVICE holds. Distinct from db-migrator in the one
# way that matters: this role has no DDL rights, and no DELETE or TRUNCATE
# anywhere, because a transaction is never erased. V2 grants it SELECT, INSERT
# and UPDATE on transactions, SELECT and INSERT on transaction_allocations, and
# nothing at all on flyway_schema_history, so the history Flyway validates
# against is out of the service's reach.
#
# Consumed by k8s/deployment.yaml. The same OpenBao path is read a second time in
# the `postgres` namespace (gitops) so CloudNativePG sets the transaction_app
# role's password to this value: one value, two readers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-transaction
  target:
    name: db-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_USERNAME: transaction_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-transaction/db-app
        property: password
