# The running service. Holds transaction_app, which V2 granted SELECT, INSERT and
# UPDATE on transactions and SELECT and INSERT on transaction_allocations, and
# nothing else -- no DDL, no DELETE, no TRUNCATE. The migration Job holds a
# different role; neither process can do the other's job.
#
# Sync wave 1, after the migration Job (a Sync hook in wave 0). Argo applies this
# only once the Job has succeeded, so a new version never starts in front of a
# schema it was not built for. The first start depends on it as well: V2 creates
# the tables this role works in, and this role could not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels: { app: transaction-service }
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: transaction-service }
  template:
    metadata:
      labels: { app: transaction-service }
    spec:
      # The service calls the ledger and Keycloak, never the Kubernetes API, so
      # the pod gets no token to call it with.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        # The published image is a Paketo buildpack build, and the JVM needs a
        # writable /tmp -- without this, readOnlyRootFilesystem below stops it
        # starting.
        - name: tmp
          emptyDir: {}
      containers:
        - name: transaction-service
          image: ghcr.io/vaullet-dev/transaction-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: APP_ENVIRONMENT,        value: prod }

            # Paketo derives the heap by SUBTRACTING a fixed code cache, metaspace
            # and thread_count x 1M from the container limit. 200 matches
            # server.tomcat.threads.max in application-prod.yaml, so the accounting
            # reflects what actually runs.
            - { name: BPL_JVM_THREAD_COUNT,   value: "200" }

            # money-rw always points at the current primary. transactions_db is
            # this service's own database (ADR-003), V2 put its tables in public,
            # and so there is no currentSchema to pin.
            - name: DB_URL
              value: jdbc:postgresql://money-rw.postgres.svc:5432/transactions_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-app, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-app, key: DB_PASSWORD } }

            # No default in application.yaml, deliberately: unset means no
            # JwtDecoder and the context refuses to start rather than serving
            # unauthenticated. Must equal Keycloak's issuer character for
            # character -- it is compared against every token's `iss`. Keycloak
            # is served under vaullet.dev/auth (gitops: keycloak.yaml, KC_HOSTNAME
            # and http.relativePath).
            - name: OAUTH2_ISSUER_URI
              value: https://vaullet.dev/auth/realms/vaullet

            # Where this service gets its own token for the ledger (ADR-008): the
            # client credentials of wallet-transaction-service, asking for
            # ledger:reserve, the ledger's scope for holds. A caller's token never
            # goes to the ledger. Keycloak's in-cluster Service, /auth relative
            # path included, rather than vaullet.dev/auth: the call has no reason
            # to leave the cluster, and the token's `iss` comes from KC_HOSTNAME
            # whichever address it was fetched from. Realm and client id keep
            # their defaults (vaullet, wallet-transaction-service).
            - { name: KEYCLOAK_URL, value: "http://keycloak-keycloakx-http.keycloak.svc/auth" }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-client, key: KEYCLOAK_CLIENT_SECRET } }

            # Every debit is a hold the ledger places (POST /v1/reservations), asked
            # for on its in-cluster Service: the ledger has no public route
            # (ADR-008). LedgerReservations refuses to start without this,
            # KEYCLOAK_URL or the secret above, naming the one that is missing.
            - { name: LEDGER_URL, value: "http://ledger-service.wallet-ledger.svc" }

            # From the ConfigMap kustomization.yaml generates. It must equal the
            # ledger's LEDGER_CURRENCY, and kustomization.yaml says why: the ledger
            # is never told a currency, so nothing else keeps the two in step.
            # Read once, at start, and recorded nowhere; TransactionService refuses
            # to start without it. TRANSACTION_MINOR_UNITS stays unset, as the
            # ledger leaves LEDGER_MINOR_UNITS: both then take ISO 4217's, 2 for
            # EUR. Set one only with the other, to the same.
            - name: TRANSACTION_CURRENCY
              valueFrom: { configMapKeyRef: { name: transaction-config, key: TRANSACTION_CURRENCY } }

          # The platform defaults' probe groups are the availability states and
          # nothing else; the database is not in either, and neither are the
          # ledger and Keycloak. Liveness is separate so the kubelet never restarts
          # a healthy JVM over an outage a restart cannot fix. Readiness drops while
          # the service starts and drains. A database outage leaves both UP: the
          # pod stays in the Service and answers each request with its own error,
          # and /actuator/health (not a probe) is what reports DOWN. Nothing in
          # health watches the ledger or Keycloak: while either is away a debit
          # answers 503 and stays PENDING, and the caller's retry with the same
          # Idempotency-Key takes it up.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30      # up to 150s for a cold JVM

          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 1536Mi }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
