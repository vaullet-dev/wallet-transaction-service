# The migrator credential, from OpenBao. This is the identity that holds DDL
# rights on transactions_db; the application role does not, which is what makes
# "the service cannot alter its own tables" a property of what is mounted rather
# than a promise in a document.
#
# Consumed only by k8s/migrate-job.yaml. The value lives at
# kv/wallet-transaction/db-migrator and is read by TWO namespaces: this one, to
# connect, and `postgres`, so CloudNativePG can set the role's password. Neither
# copy is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-transaction   # lives in gitops: cluster-scoped, platform project
  target:
    name: db-migrator
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The property names the application binds are identical for both
        # identities (see application.yaml). WHICH identity a process runs as is
        # decided by the pod spec, never by configuration in this repository.
        DB_USERNAME: transaction_migrator
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-transaction/db-migrator
        property: password
