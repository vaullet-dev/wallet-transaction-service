# The secret this service asks Keycloak for its own token with (ADR-008): client
# `wallet-transaction-service` in realm `vaullet`, confidential and client credentials only, offering
# ledger:write as an optional scope (gitops realm/31-wallet-transaction-service.yaml). That token,
# never a caller's, is what the ledger sees on every hold this service asks it for.
#
# Consumed by k8s/deployment.yaml as KEYCLOAK_CLIENT_SECRET. Not by the migration Job, which never
# calls Keycloak.
#
# The same OpenBao path is read a second time in the `keycloak` namespace (gitops,
# apps/keycloak-config) so keycloak-config-cli sets the client's secret to this value: one value,
# two readers, the pattern db-app already follows. Put it there once, with a value you generate:
#
#   bao kv put kv/wallet-transaction/keycloak-client secret="$(openssl rand -base64 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-transaction
  target:
    name: keycloak-client
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KEYCLOAK_CLIENT_SECRET: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: wallet-transaction/keycloak-client
        property: secret
