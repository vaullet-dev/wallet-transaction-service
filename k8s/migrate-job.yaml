# Flyway, as a Job, holding the migrator role. Not the service: in a deployed
# environment application-prod.yaml sets spring.flyway.enabled=false, so the
# running service never has DDL rights and never sees this credential.
#
# An Argo SYNC HOOK rather than a plain Job. A Job's spec is immutable, so a
# plain Job cannot be updated when the image tag changes -- Argo would try, the
# API would refuse, and the sync would fail on every release. BeforeHookCreation
# deletes the previous Job and creates a new one each sync, which is what "run
# the migrations for this version" actually means.
#
# Sync wave 0, and the Deployment is wave 1: Argo applies the Deployment only
# after this Job has succeeded. A failed migration fails the sync and leaves the
# running version exactly as it was. Which is also why the Job must exit 0 once
# Flyway has run, and why it is given no issuer, no KEYCLOAK_* and no LEDGER_URL:
# it needs none. The `migrate` profile starts no web server, so no security stack
# (application-migrate.yaml), and the beans that call the ledger and Keycloak --
# TransactionController, TransactionService and LedgerReservations -- are
# @Profile("!migrate") and do not exist in this process. Built here, any one of
# them would fail the context after Flyway had already run: a migrated schema, a
# failed Job and a Deployment held back for good, wallet-auth-service's 0.10.0 bug.
apiVersion: batch/v1
kind: Job
metadata:
  name: transaction-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  # A migration that hangs holds an advisory lock. Fail loudly instead.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      # Flyway never calls the Kubernetes API, so the pod gets no token to call
      # it with.
      automountServiceAccountToken: false
      volumes:
        # The image is a Paketo buildpack build (spring-boot:build-image, in the
        # release job of ci.yml), not the Dockerfile in this repo, which is kept
        # only for environments that require one. The JVM needs a writable /tmp,
        # so readOnlyRootFilesystem below requires this.
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          # Rewritten by kustomize from the images: block in kustomization.yaml.
          # ADR-010 §4: never a mutable tag.
          image: ghcr.io/vaullet-dev/transaction-service
          imagePullPolicy: IfNotPresent
          env:
            # Order matters: later wins, so `migrate` beats prod's
            # flyway.enabled=false. Reversed, this Job starts, migrates nothing
            # and exits 0 -- a silent no-op that looks like success.
            - name: SPRING_PROFILES_ACTIVE
              value: prod,migrate
            # Paketo sizes the heap from the container limit by SUBTRACTING fixed
            # regions: a 240M code cache, metaspace for the classes in the jar, and
            # thread_count x 1M of stacks. Its default of 250 threads is sized for
            # a web application; this Job serves nothing, and 50 hands the 200M
            # difference to the heap instead.
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: APP_ENVIRONMENT
              value: prod
            # money-rw always points at the current primary of the `money`
            # CloudNativePG cluster, where ADR-003 puts transactions_db next to the
            # ledger's vaullet_db: one restore unit. No currentSchema, unlike
            # auth-service: the database is this service's alone, and V2 put its
            # tables in public.
            - name: DB_URL
              value: jdbc:postgresql://money-rw.postgres.svc:5432/transactions_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-migrator, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-migrator, key: DB_PASSWORD } }
            # No TRANSACTION_CURRENCY, deliberately, unlike the ledger's Job. That
            # one records LEDGER_CURRENCY in ledger_config and fails the sync on a
            # mismatch; this schema records no deployment currency at all, only the
            # currency each transaction was asked in. The one reader of the setting
            # is TransactionService, which is @Profile("!migrate") and so absent
            # here, and TransactionProperties binds it unset without complaint.
            # Given to this Job, it would be read by nothing, and would look like a
            # check that never happens.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 1Gi, not less: see BPL_JVM_THREAD_COUNT above. Squeezed far enough,
            # the Paketo memory calculator refuses to produce a configuration at
            # all rather than starting with a small heap.
            limits:   { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      securityContext:
        runAsNonRoot: true          # the image's own user; no UID hardcoded here
        seccompProfile: { type: RuntimeDefault }
