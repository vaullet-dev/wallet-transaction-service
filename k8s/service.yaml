# ClusterIP. Public traffic arrives through k8s/httproute.yaml as
# vaullet.dev/api/transactions; callers inside the cluster use this Service
# directly, as transaction-service.wallet-transaction.svc (ADR-008 governs
# service-to-service auth).
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  type: ClusterIP
  selector: { app: transaction-service }
  ports:
    - { name: http, port: 80, targetPort: http }
