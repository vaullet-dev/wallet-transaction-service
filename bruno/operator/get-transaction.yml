info:
  name: Get transaction
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/transactions/{{transaction_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvName() === "prod") {
          bru.runner.skipRequest();
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The last transaction a create named: the CREDIT's, run top to bottom. `transaction:read` reads any
  transaction, on any account; an id that does not exist is `404 RESOURCE_NOT_FOUND`.
