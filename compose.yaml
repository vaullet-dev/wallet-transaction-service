# Local dependencies. Started and stopped automatically by spring-boot-docker-compose when the
# application runs under the `local` profile. Testcontainers provides the same database to the
# test suite, so "what this service needs to run" is defined once, here.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions
    ports:
      # Not 5432, and not the ledger's 55432 or auth's 55433, so all three run side by side.
      # Override with DB_HOST_PORT if 55434 is taken.
      - '${DB_HOST_PORT:-55434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transactions -d transactions']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      # From PostgreSQL 18 the official image keeps the cluster in a version-named
      # subdirectory of /var/lib/postgresql, so that is the mount, not .../data.
      - /var/lib/postgresql
